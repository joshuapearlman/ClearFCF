<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clear FCF Screener</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/audit.css">
</head>
<body>
  <header>
    <h1>Clear FCF Screener</h1>
    <p>Normalized Free-Cash-Flow Idea Screener</p>
  </header>

  <main>
    <section class="controls">
      <div class="control-group">
        <label for="universe">Screening Universe:</label>
        <select id="universe">
          <option value="yahoo">Yahoo Discovery</option>
          <option value="sp500">S&P 500 (Large Cap)</option>
          <option value="midcap">S&P 400 (Mid Cap)</option>
          <option value="smallcap">Small-Cap Value</option>
          <option value="sec_all">Full SEC Directory</option>
        </select>
      </div>
      
      <div class="control-group">
        <label for="manualTickers">Or Manual Tickers (comma separated):</label>
        <input type="text" id="manualTickers" placeholder="e.g. AAPL, MSFT, GOOG">
      </div>

      <div class="control-group toggles">
        <label>
          <input type="checkbox" id="skipReviewed" checked>
          Skip Previously Reviewed
        </label>
        <button id="resetHistoryBtn" class="secondary-btn">Reset History</button>
      </div>

      <div class="control-actions">
        <button id="screenBtn" class="primary-btn">Run Screen</button>
        <button id="exportBtn" class="secondary-btn" disabled>Export CSV</button>
      </div>
    </section>

    <section id="results" class="results-container">
      <div id="loading" class="hidden">Running analysis...</div>
      <table id="screenerTable" class="hidden">
        <thead>
          <tr>
            <th>Ticker</th>
            <th>Company Name</th>
            <th>Status</th>
            <th>Price</th>
            <th>P/nFCF</th>
            <th>FCF Yield</th>
            <th>Warnings</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </section>
  </main>

  <div id="auditModal" class="modal hidden">
    <div class="modal-content">
      <span id="closeModal" class="close">&times;</span>
      <div id="auditContent"></div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
