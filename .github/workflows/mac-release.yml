name: Mac Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: v1.1.1

jobs:
  release-mac:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Install dependencies
        run: |
          # Both native Codex executables are needed even though the runner has one CPU architecture.
          printf '\nsupportedArchitectures:\n  os:\n    - darwin\n  cpu:\n    - arm64\n    - x64\n' >> pnpm-workspace.yaml
          pnpm install --frozen-lockfile

      - name: Check release version and signing credentials
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          node -e "const p = require('./package.json'); if (process.env.GITHUB_REF_TYPE !== 'tag' || process.env.GITHUB_REF_NAME !== 'v' + p.version) { console.error('Run this workflow from the v' + p.version + ' tag.'); process.exit(1); }"
          if [[ -z "$CSC_LINK" || -z "$CSC_KEY_PASSWORD" ]]; then
            echo 'Set MAC_CSC_LINK and MAC_CSC_KEY_PASSWORD for a Developer ID Application certificate.' >&2
            exit 1
          fi
          if [[ -n "$APPLE_API_KEY" && -n "$APPLE_API_KEY_ID" && -n "$APPLE_API_ISSUER" && -n "$APPLE_TEAM_ID" ]]; then
            exit 0
          fi
          if [[ -n "$APPLE_ID" && -n "$APPLE_APP_SPECIFIC_PASSWORD" && -n "$APPLE_TEAM_ID" ]]; then
            exit 0
          fi
          echo 'Set APPLE_API_KEY, APPLE_API_KEY_ID, APPLE_API_ISSUER, and APPLE_TEAM_ID, or the three Apple ID notarization secrets.' >&2
          exit 1

      - name: Run tests
        run: pnpm test

      - name: Build, sign, notarize, and upload Mac app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm publish:mac

      - name: Verify Mac packages
        run: |
          shopt -s nullglob
          apps=(dist/mac*/ClearFCF.app)
          dmgs=(dist/ClearFCF-*.dmg)
          zips=(dist/ClearFCF-*-mac.zip)
          if [[ ${#apps[@]} -ne 2 || ${#dmgs[@]} -ne 2 || ${#zips[@]} -ne 2 || ! -s dist/latest-mac.yml ]]; then
            echo 'Expected signed Apple Silicon and Intel apps, DMGs, ZIPs, and updater metadata.' >&2
            exit 1
          fi
          for bundle in "${apps[@]}"; do
            codesign --verify --deep --strict --verbose=2 "$bundle"
            xcrun stapler validate "$bundle"
            spctl --assess --verbose --type exec "$bundle"
          done

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(gh release view "$GITHUB_REF_NAME" --json assets --jq '[.assets[].name | select(endswith(".dmg"))] | length')" -eq 2
          test "$(gh release view "$GITHUB_REF_NAME" --json assets --jq '[.assets[].name | select(endswith("-mac.zip"))] | length')" -eq 2
          test "$(gh release view "$GITHUB_REF_NAME" --json assets --jq 'any(.assets[].name; . == "latest-mac.yml")')" = true
          gh release edit "$GITHUB_REF_NAME" --title "ClearFCF ${GITHUB_REF_NAME#v}" --notes-file ../docs/releases/v1.2.0.md --draft=false
